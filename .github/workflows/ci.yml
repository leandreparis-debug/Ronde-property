name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        # The pnpm version is read from the `packageManager` field of package.json.

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Known vulnerabilities of the production dependencies (registry advisories).
      - run: pnpm audit --prod

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret removed by a later commit is still a leak.
          fetch-depth: 0

      - name: gitleaks (whole history, findings redacted)
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.28.0 -c
          "git config --global --add safe.directory /repo &&
          gitleaks git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1"

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ronde_test
      AUTH_PROVIDER: local
      ALLOW_LOCAL_AUTH: "true"
      LOCAL_AUTH_SECRET: ci-local-secret-ronde-0123456789abcdef
      STORAGE_PROVIDER: local
      ALLOW_LOCAL_STORAGE: "true"
      LOCAL_STORAGE_SECRET: ci-local-storage-secret-ronde-0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:reset

      - run: pnpm test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Acceptance of phase 1 (specification § 14): criteria C1 to C6, on a fresh database.
      - run: pnpm db:reset
        if: success()

      - run: pnpm test:acceptance
        if: success()
        env:
          CI: "true"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-acceptance
          path: playwright-report-acceptance/
          retention-days: 30

  db:
    name: Database (migrations, RLS, triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ronde_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:reset

      - run: pnpm test:db
